<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Pack</title>
<meta name="description" content="Dump everything you're bringing. Pack sorts it into a smart, shareable packing list.">
<meta name="theme-color" content="#1F3D34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pack">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="stylesheet" href="/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>
<div id="app" aria-live="polite">
  <div class="boot"><img src="/apple-touch-icon.png" alt=""><span class="spin"></span></div>
</div>
<div id="sheet" class="sheet-bg hidden" role="dialog" aria-modal="true"><div class="sheet" id="sheetBody"></div></div>
<div id="toast" class="toast hidden" role="status"></div>
</body>
</html>
